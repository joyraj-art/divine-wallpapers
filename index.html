<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Divine Wallpapers | HD 4K Hindu Devotional Wallpapers</title>

<meta name="description"
      content="Download premium HD, Full HD, 4K and AMOLED Hindu devotional wallpapers featuring Mahadev, Hanuman, Shree Ram and Sri Krishna.">

<meta name="robots"
      content="index, follow">

<link rel="canonical"
      href="https://joyraj-art.github.io/divine-wallpapers/">

<style>

/* ===============================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}


/* ===============================
   HEADER
================================ */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(5, 5, 5, 0.96);

    border-bottom: 1px solid rgba(255, 120, 0, 0.20);

    backdrop-filter: blur(12px);

    padding: 12px 18px;
}

.nav {
    max-width: 1400px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 9px;
}

.logo-icon {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background: linear-gradient(
        135deg,
        #ffb300,
        #ff5b00
    );

    color: #000;

    font-size: 20px;
    font-weight: bold;
}

.logo-title {
    font-size: 18px;
    font-weight: 800;
}

.logo-subtitle {
    color: #777;
    font-size: 8px;
    letter-spacing: 1px;
    margin-top: 3px;
}

.nav-links {
    display: flex;
    gap: 18px;
}

.nav-links a {
    color: #999;
    text-decoration: none;
    font-size: 11px;
    transition: 0.2s;
}

.nav-links a:hover {
    color: #ff7800;
}


/* ===============================
   HERO
================================ */

.hero {
    max-width: 1400px;
    min-height: 300px;

    margin: 14px auto 0;

    padding: 48px 40px;

    border-radius: 22px;

    border: 1px solid rgba(255, 120, 0, 0.25);

    background:
        radial-gradient(
            circle at 85% 45%,
            rgba(255, 100, 0, 0.30),
            transparent 35%
        ),
        linear-gradient(
            130deg,
            #080604,
            #160a03
        );

    position: relative;
    overflow: hidden;
}

.hero::after {
    content: "ॐ";

    position: absolute;

    right: 70px;
    top: 40px;

    font-size: 160px;

    color: rgba(255, 120, 0, 0.07);

    pointer-events: none;
}

.badge {
    display: inline-block;

    padding: 8px 13px;

    border-radius: 20px;

    border: 1px solid rgba(255, 130, 0, 0.35);

    background: rgba(255, 100, 0, 0.07);

    color: #ff9a35;

    font-size: 10px;
}

.hero h1 {
    margin-top: 18px;

    font-size: clamp(40px, 6vw, 65px);

    line-height: 1;

    letter-spacing: -2px;

    max-width: 650px;
}

.orange {
    color: #ff6a00;
}

.hero p {
    margin-top: 18px;

    max-width: 650px;

    color: #999;

    font-size: 13px;

    line-height: 1.7;
}

.hero-buttons {
    display: flex;

    gap: 10px;

    margin-top: 22px;

    flex-wrap: wrap;
}

.hero-button {
    padding: 13px 18px;

    border-radius: 9px;

    text-decoration: none;

    font-size: 11px;

    font-weight: bold;

    background: linear-gradient(
        135deg,
        #ffad00,
        #ff6200
    );

    color: #000;
}

.hero-button.secondary {
    background: #111;

    color: #ddd;

    border: 1px solid #333;
}


/* ===============================
   SEARCH
================================ */

.controls {
    max-width: 1400px;

    margin: 18px auto 0;
}

.search-box {
    width: 100%;

    padding: 15px 18px;

    border-radius: 14px;

    border: 1px solid #292929;

    background: #0d0d0d;

    color: #fff;

    outline: none;

    font-size: 13px;
}

.search-box::placeholder {
    color: #666;
}

.search-box:focus {
    border-color: #ff7200;
}


/* ===============================
   CATEGORIES
================================ */

.categories {
    display: flex;

    gap: 8px;

    margin-top: 12px;

    overflow-x: auto;

    padding-bottom: 5px;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;

    padding: 9px 14px;

    border-radius: 30px;

    border: 1px solid #292929;

    background: #0d0d0d;

    color: #aaa;

    cursor: pointer;

    font-size: 11px;

    transition: 0.2s;
}

.category:hover {
    border-color: #ff7200;
    color: #fff;
}

.category.active {
    background: linear-gradient(
        135deg,
        #ffad00,
        #ff6200
    );

    color: #000;

    border-color: transparent;

    font-weight: bold;
}


/* ===============================
   WALLPAPER SECTION
================================ */

.section {
    max-width: 1400px;

    margin: 28px auto;
}

.section-title {
    font-size: 22px;
}

.section-subtitle {
    color: #666;

    font-size: 11px;

    margin-top: 5px;

    margin-bottom: 16px;
}


/* ===============================
   WALLPAPER GRID
================================ */

.wallpaper-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 10px;
}


/* ===============================
   CARD
================================ */

.card {
    background: #0c0c0c;

    border: 1px solid #242424;

    border-radius: 13px;

    overflow: hidden;

    transition:
        transform 0.2s,
        border-color 0.2s;
}

.card:hover {
    transform: translateY(-3px);

    border-color: rgba(255, 120, 0, 0.55);
}

.wallpaper-image {
    width: 100%;

    aspect-ratio: 9 / 16;

    object-fit: cover;

    display: block;

    cursor: pointer;
}

.card-info {
    padding: 9px;
}

.card-title {
    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.card-category {
    color: #777;

    font-size: 9px;

    margin-top: 5px;
}

.card-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 6px;

    margin-top: 8px;
}

.btn {
    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 32px;

    border-radius: 7px;

    border: none;

    font-size: 9px;

    font-weight: bold;

    cursor: pointer;

    text-decoration: none;
}

.download {
    background: #fff;

    color: #000;
}

.fullscreen {
    background: #171717;

    color: #fff;

    border: 1px solid #303030;
}

.btn:hover {
    opacity: 0.85;
}


/* ===============================
   NO RESULTS
================================ */

.no-results {
    display: none;

    text-align: center;

    padding: 60px 20px;

    color: #777;
}


/* ===============================
   FULLSCREEN VIEWER
================================ */

.viewer {
    position: fixed;

    inset: 0;

    z-index: 99999;

    display: none;

    align-items: center;

    justify-content: center;

    background: rgba(0, 0, 0, 0.97);

    padding: 20px;
}

.viewer.show {
    display: flex;
}

.viewer-image {
    max-width: 94vw;

    max-height: 88vh;

    width: auto;

    height: auto;

    object-fit: contain;

    border-radius: 6px;
}

.close-viewer {
    position: absolute;

    top: 16px;
    right: 18px;

    width: 44px;
    height: 44px;

    border-radius: 50%;

    border: 1px solid #444;

    background: #151515;

    color: #fff;

    font-size: 25px;

    cursor: pointer;

    z-index: 2;
}

.close-viewer:hover {
    background: #ff6800;

    color: #000;
}

.viewer-download {
    position: absolute;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%);

    padding: 12px 20px;

    border-radius: 8px;

    background: linear-gradient(
        135deg,
        #ffad00,
        #ff6200
    );

    color: #000;

    text-decoration: none;

    font-size: 11px;

    font-weight: bold;
}


/* ===============================
   FOOTER
================================ */

footer {
    border-top: 1px solid #24170d;

    margin-top: 45px;

    padding: 28px 15px;

    text-align: center;

    color: #666;

    font-size: 11px;
}

footer strong {
    color: #ff7200;
}


/* ===============================
   MOBILE
================================ */

@media (max-width: 700px) {

    header {
        padding: 9px 12px;
    }

    .nav {
        gap: 8px;
    }

    .logo-title {
        font-size: 14px;
    }

    .logo-icon {
        width: 29px;
        height: 29px;
        font-size: 17px;
    }

    .nav-links {
        gap: 8px;
    }

    .nav-links a {
        font-size: 8px;
    }

    .hero {
        margin-top: 10px;

        min-height: 270px;

        padding: 32px 22px;

        border-radius: 17px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero p {
        font-size: 11px;
    }

    .hero::after {
        right: -15px;

        font-size: 120px;
    }

    .controls {
        margin: 15px 8px 0;
    }

    .section {
        margin: 22px 8px;
    }

    .wallpaper-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 8px;
    }

    .card-info {
        padding: 8px;
    }

    .card-title {
        font-size: 10px;
    }

    .btn {
        font-size: 8px;
    }

}

</style>

</head>

<body>
